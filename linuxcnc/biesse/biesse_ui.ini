#
# Biesse Skill 1224 - LinuxCNC 2.9 (nyx build) + Yurtaev YMTL2P (MECHATROLINK-II)
# Based on the nyx-mtl2 sample, 2019-2023 http://yurtaev.com
#
# Drives (from SigmaWin+ backups in "As Built"):
#   servo-00  st 0x41  X1  SGDV-1R9D11A + SGMGV-05DDW-YG13
#   servo-01  st 0x42  X2  SGDV-1R9D11A + SGMGV-05DDW-YG13  (Pn000.0=1, mirrored)
#   servo-02  st 0x43  Y   SGDV-1R9D11A + SGMGV-05DDW-YG13
#   servo-03  st 0x44  Z   SGDV-1R9D11A + SGMGV-05DDW-YG14  (brake, drive-controlled via /BK)
#
# Values marked TODO must be confirmed on the machine before cutting.
#

[EMC]
MACHINE                 = Biesse-Skill-1224
VERSION                 = 1.1

[DISPLAY]
# Biesse touch screen (qtvcp/screens/biesse_ui), generated for the 1440x900 monitor:
#   gen_biesse_ui.py qtvcp/screens/biesse_ui/biesse_ui.ui 0.75
# BIESSE_UI_SCALE must match that scale. biesse.ini keeps the AXIS screen.
DISPLAY                 = qtvcp -m biesse_ui
PREFERENCE_FILE_PATH    = WORKINGFOLDER/biesse_ui.pref
BIESSE_UI_SCALE         = 0.75
CYCLE_TIME              = 0.1
POSITION_OFFSET         = RELATIVE
POSITION_FEEDBACK       = ACTUAL
MAX_FEED_OVERRIDE       = 1.5
MAX_SPINDLE_OVERRIDE    = 1.0
MAX_LINEAR_VELOCITY     = 1000
DEFAULT_LINEAR_VELOCITY = 10
PROGRAM_PREFIX          = /home/cnc/linuxcnc/nc_files
INTRO_GRAPHIC           = linuxcnc.gif
INTRO_TIME              = 1
INCREMENTS              = 10mm, 1mm, 0.1mm, 0.01mm
GEOMETRY                = XYZ

[TASK]
TASK                    = milltask
CYCLE_TIME              = 0.01

[RS274NGC]
PARAMETER_FILE          = biesse.var

[EMCMOT]
EMCMOT                  = motmod
SERVO_PERIOD            = 1000000
COMM_TIMEOUT            = 1.0

[HAL]
HALUI                   = halui
HALFILE                 = biesse.hal
POSTGUI_HALFILE         = biesse_ui_postgui.hal

[NYX]
# empty.par = do not download parameters, keep the Biesse tuning stored in the drives.
# Do NOT switch to par/sgdv.par: it would overwrite gains, I/O mapping and regen settings.
PARAMS                  = par/empty.par
AXES                    = 4
# counts/s -> rpm. Drives use Pn20E/Pn210 = 4/1 on a 20-bit encoder = 262144 ref units/rev,
# so 262144/60. (Sample used 131072/60 for 17-bit.) TODO verify vel-fb vs SigmaWin Un000.
VEL_SCALE               = 4369.066667
TRQ_SCALE               = 163.84

[SPINDLE_0]
# Spindle speed cap requested 2026-10-31. Not wired to the VFD yet: S words are limited
# here but nothing drives the spindle until the spindle I/O is configured.
MAX_FORWARD_VELOCITY    = 18000
MIN_FORWARD_VELOCITY    = 0
# router spindle: no reverse
MAX_REVERSE_VELOCITY    = 0

[EMCIO]
EMCIO                   = iov2
CYCLE_TIME              = 0.1
TOOL_TABLE              = tool.tbl

[TRAJ]
COORDINATES             = X X Y Z
LINEAR_UNITS            = mm
ANGULAR_UNITS           = degree
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY     = 1000
POSITION_FILE           = biesse.pos

[KINS]
KINEMATICS              = trivkins coordinates=XXYZ
JOINTS                  = 4

# ---- soft limits 2026-10-31: home (machine 0) is the positive end of each axis, +2 mm allowed past it ----

# X/Y max 60 m/min per Biesse Skill 1224 G FT spec (dealer listing); Z kept at 1.5 m/min
[AXIS_X]
MAX_VELOCITY            = 1000
MAX_ACCELERATION        = 375
# TODO real travel
# X- limit stop probed at -3362.6 (both sides, 2026-11-01): soft limit 3 mm inside it.
MIN_LIMIT               = -3359.6
MAX_LIMIT               = 2

[AXIS_Y]
MAX_VELOCITY            = 1000
MAX_ACCELERATION        = 375
# Y limits 3 mm inside the probed stops (-1731.01 / +5 after the shift)
MIN_LIMIT               = -1728
MAX_LIMIT               = 2

[AXIS_Z]
MAX_VELOCITY            = 50
MAX_ACCELERATION        = 250
# Z- limit stop probed at -340.676 (2026-11-01): soft limit 3 mm inside it.
MIN_LIMIT               = -337.6
MAX_LIMIT               = 2

# X1 (servo-00) and X2 (servo-01) home together (same negative HOME_SEQUENCE).
# nyx starts every axis at 0 counts after a drive power cycle, so all axes home on their
# limit switches (following-error comparators in biesse.hal): press Home All after start-up.

[JOINT_0]
TYPE                    = LINEAR
HOME                    = 0
MAX_VELOCITY            = 1000
MAX_ACCELERATION        = 375
BACKLASH                = 0.000
# SCALE = mm per motor rev (nyx: pos = counts * SCALE / 2^20). TODO measure X
# X direction reversed after first jog 2026-10-31 (X1 and X2 must match)
# X: same drive train as Y (48.267 mm/rev), 12 in move checked 2026-10-31
SCALE                   = -48.267
# X- limit stop probed at -3362.6 (both sides, 2026-11-01): soft limit 3 mm inside it.
MIN_LIMIT               = -3359.6
MAX_LIMIT               = 2
FERROR                  = 40
MIN_FERROR              = 5
# X1 (master) and X2 home together (HOME_SEQUENCE -2) on the shared X home cam
# switch (DEC, read on X1 = nyx servo-00.in-02 for both joints; TRUE above about
# X -25.6, ~30 mm before the X+ limit) plus X1's motor index (2026-11-03; before,
# X homed by stalling on the X+ limits): search X+ at 30 mm/s onto the cam, creep
# back at 1 mm/s until it opens, then on to X1's next index pulse 6.14 mm further.
# That index is at -35.36 in the earlier X frame (matched on the cam edge, +/-0.7).
# X2 follows X1: X1's index-enable drives both joints and X2 has
# HOME_INDEX_NO_ENCODER_RESET, so X2 takes its position at the same moment.
# This keeps the gantry as it is; to square it, give X2 its own index (biesse.hal)
# and a calibrated HOME_OFFSET.
HOME_OFFSET             = -35.36
# Search 60 mm/s (2026-11-03): stops ~5 mm after the cam, 30 mm before the limit
HOME_SEARCH_VEL         = 60
HOME_LATCH_VEL          = -1
HOME_FINAL_VEL          = 30
HOME_USE_INDEX          = YES
HOME_SEQUENCE           = -2
ABSOLUTE_ENCODER        = 0

[JOINT_1]
TYPE                    = LINEAR
HOME                    = 0
MAX_VELOCITY            = 1000
MAX_ACCELERATION        = 375
BACKLASH                = 0.000
# X direction reversed after first jog 2026-10-31 (X1 and X2 must match)
# X: same drive train as Y (48.267 mm/rev), 12 in move checked 2026-10-31
SCALE                   = -48.267
# X- limit stop probed at -3362.6 (both sides, 2026-11-01): soft limit 3 mm inside it.
MIN_LIMIT               = -3359.6
MAX_LIMIT               = 2
FERROR                  = 40
MIN_FERROR              = 5
# X2 (follower): see JOINT_0. HOME_INDEX_NO_ENCODER_RESET = YES because X2's encoder
# is not reset by X1's index: LinuxCNC takes X2's position when X1's index arrives.
HOME_OFFSET             = -35.36
HOME_SEARCH_VEL         = 60
HOME_LATCH_VEL          = -1
HOME_FINAL_VEL          = 30
HOME_USE_INDEX          = YES
HOME_INDEX_NO_ENCODER_RESET= YES
HOME_SEQUENCE           = -2
ABSOLUTE_ENCODER        = 0

[JOINT_2]
TYPE                    = LINEAR
HOME                    = -1724
MAX_VELOCITY            = 1000
MAX_ACCELERATION        = 375
BACKLASH                = 0.000
# SCALE = mm per motor rev (nyx: pos = counts * SCALE / 2^20)
# Y: 12 in tape = 6621688 counts, 2026-10-31 (refine with a longer precise move)
SCALE                   = 48.267
# Y limits 3 mm inside the probed stops (-1731.01 / +5 after the shift)
MIN_LIMIT               = -1728
MAX_LIMIT               = 2
FERROR                  = 40
MIN_FERROR              = 5
# Y homes on its home cam switch (DEC = nyx servo-02.in-02, TRUE below about Y -1713.7,
# ~17 mm before the Y- limit) plus the motor index (2026-11-03; before, Y homed
# by stalling on the Y- limit): search Y- at 30 mm/s onto the cam, creep back at
# 1 mm/s until it opens, then on to the next index pulse 5.89 mm further (repeats
# to 4 counts). That index is at -1704.1 in the earlier, tape-measured Y frame
# (matched on the cam edge, +/-0.7 mm). Next pulses are 48.27 mm away either side.
HOME_OFFSET             = -1704.1
HOME_SEARCH_VEL         = -60
HOME_LATCH_VEL          = 1
HOME_FINAL_VEL          = 30
HOME_USE_INDEX          = YES
HOME_SEQUENCE           = 1
ABSOLUTE_ENCODER        = 0

[JOINT_3]
TYPE                    = LINEAR
HOME                    = 0
MAX_VELOCITY            = 50
MAX_ACCELERATION        = 250
BACKLASH                = 0.000
# Z direction reversed after first jog 2026-10-31
# Z: 4 in tape = 5.0575 rev -> 20.09 mm/rev, taken as 20 mm-pitch ballscrew, direct drive (2026-10-31)
SCALE                   = -20.0
# Z- limit stop probed at -340.676 (2026-11-01): soft limit 3 mm inside it.
MIN_LIMIT               = -337.6
MAX_LIMIT               = 2
FERROR                  = 5
MIN_FERROR              = 3
# Home on the Z home switch (cam, DEC = nyx servo-03.in-02, TRUE above about Z -21),
# never touching the top stop (2026-11-03; before, Z homed by stalling at the + stop):
# search up at 5 mm/s until the cam switch closes, back off, creep up at 1 mm/s onto
# it again (edge at -21.0, repeats to ~0.07 mm), then on up to the next motor index
# pulse, 2.2 mm higher at -18.771 (pulses every 20 mm at 1.229 - 20k).
# Searching for the index DOWNWARD from the switch latched a false index 2.7 mm
# below it (2026-11-03 test), so the latch must be upward (positive).
# Margin: if the cam ever moves up 2 mm or more, the +1.229 pulse would be caught and
# machine 0 would be 20 mm too high - re-check the switch edge after cam work.
# Machine 0 stays where it was: 5 mm below the top stop.
HOME_OFFSET             = -18.771
HOME_SEARCH_VEL         = 20
HOME_LATCH_VEL          = 1
HOME_FINAL_VEL          = 5
HOME_USE_INDEX          = YES
HOME_SEQUENCE           = 0
ABSOLUTE_ENCODER        = 0

[BIESSE]
# biesse_ui screen: X/Y speed (feeds, rapids, jogs) is capped at LOCKED_MAX_FEED mm/min
# until the FULL SPEED button is unlocked with this password. Locks again on E-stop.
LOCKED_MAX_FEED         = 10000
FULL_SPEED_PASSWORD     = wickedfast
# jog speed slider at start-up until one is saved on CONFIG (mm/min); Shift = fast jog
DEFAULT_JOG             = 2000
# NO while the tool length sensor has no HAL input (blocks TOOL PROBE); see biesse_ui_postgui.hal
TOOL_SENSOR             = NO
# CONFIG "Override limits" (unhomed joint jogging) speed cap, mm/min
OVERRIDE_JOG_MAX        = 2000
