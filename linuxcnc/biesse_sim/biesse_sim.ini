# Biesse Skill 1224 - SIMULATION config for screen development (no hardware).
# Same travel, speeds and home positions as ../biesse/biesse.ini; the YMTL2P
# drives are replaced by LinuxCNC's simulated joints, and X is one joint here
# (the real machine has the X1/X2 gantry). Homing sets position in place.

[EMC]
VERSION = 1.1
MACHINE = Biesse Skill 1224 (sim)
DEBUG = 0x00000000

[DISPLAY]
DISPLAY = qtvcp qtdragon_hd
TITLE = Biesse Skill 1224 (sim)
PREFERENCE_FILE_PATH = WORKINGFOLDER/biesse_sim.pref
MAX_FEED_OVERRIDE = 1.5
MIN_SPINDLE_0_OVERRIDE = 0.5
MAX_SPINDLE_0_OVERRIDE = 1.0
DEFAULT_SPINDLE_0_SPEED = 12000
SPINDLE_INCREMENT = 500
MIN_SPINDLE_0_SPEED = 6000
MAX_SPINDLE_0_SPEED = 18000
MAX_SPINDLE_POWER = 9000
MIN_LINEAR_VELOCITY = 0
MAX_LINEAR_VELOCITY = 1000
DEFAULT_LINEAR_VELOCITY = 50
INCREMENTS = 10 mm, 1.0 mm, 0.10 mm, 0.01 mm
CYCLE_TIME = 100
PROGRAM_PREFIX = ~/linuxcnc/nc_files
MDI_HISTORY_FILE = mdi_history.dat
LOG_FILE = biesse_sim.log

[MDI_COMMAND_LIST]
MDI_COMMAND = G53 G0 Z0;G53 G0 X0 Y-1724,Park

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap G-Code File (*.ngc,*.nc,*.tap)

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[RS274NGC]
PARAMETER_FILE = biesse_sim.var
RS274NGC_STARTUP_CODE = G17 G21 G40 G43H0 G54 G64P0.05 G80 G90 G94 G97 M5 M9

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 1.0
BASE_PERIOD = 100000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 1000
DEFAULT_LINEAR_VELOCITY = 50
SPINDLES = 1

[HAL]
HALUI = halui
HALFILE = core_sim.hal
POSTGUI_HALFILE = qtdragon_hd_postgui.hal

[HALUI]

[SPINDLE_0]
MAX_FORWARD_VELOCITY = 18000
MIN_FORWARD_VELOCITY = 0
MAX_REVERSE_VELOCITY = 0

[AXIS_X]
MIN_LIMIT = -3359.6
MAX_LIMIT = 2
MAX_VELOCITY = 1000
MAX_ACCELERATION = 375

[AXIS_Y]
MIN_LIMIT = -1728
MAX_LIMIT = 2
MAX_VELOCITY = 1000
MAX_ACCELERATION = 375

[AXIS_Z]
MIN_LIMIT = -337.6
MAX_LIMIT = 2
MAX_VELOCITY = 50
MAX_ACCELERATION = 250
OFFSET_AV_RATIO = 0.2

[JOINT_0]
AXIS = X
TYPE = LINEAR
MIN_LIMIT = -3359.6
MAX_LIMIT = 2
MAX_VELOCITY = 1000
MAX_ACCELERATION = 375
FERROR = 40
MIN_FERROR = 5
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 2

[JOINT_1]
AXIS = Y
TYPE = LINEAR
MIN_LIMIT = -1728
MAX_LIMIT = 2
MAX_VELOCITY = 1000
MAX_ACCELERATION = 375
FERROR = 40
MIN_FERROR = 5
HOME = -1724
HOME_OFFSET = -1724
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 1

[JOINT_2]
AXIS = Z
TYPE = LINEAR
MIN_LIMIT = -337.6
MAX_LIMIT = 2
MAX_VELOCITY = 50
MAX_ACCELERATION = 250
FERROR = 5
MIN_FERROR = 3
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
